<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松江のお気に入りマップ 更新状況</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid #ccc; padding: .3rem .7rem; text-align: left; }
  code { background: #f3f3f3; padding: .1rem .3rem; }
</style>
</head>
<body>
<h1>松江のお気に入りマップ 更新状況</h1>
<p>公開地図：<a href="https://umap.openstreetmap.fr/ja/map/map_1430611">uMap</a>／
投稿フォーム：<a href="https://form.jotform.com/261802572611048">Jotform</a>／
データ：<a href="favorites.geojson">favorites.geojson</a></p>
<p id="built">読み込み中…</p>
<table id="counts"></table>
<script>
fetch('status.json?' + Date.now()).then(r => r.json()).then(s => {
  document.getElementById('built').textContent = '最終更新：' + s.built_at;
  const label = {active:'有効な投稿', deleted:'削除済み', no_consent:'非同意', no_location:'位置なし',
    out_of_bbox:'松江市外', duplicate:'二重投稿', no_photo:'写真なし', published:'掲載件数',
    thumb_new:'サムネ新規', thumb_failed:'サムネ失敗', thumb_removed:'サムネ削除'};
  const t = document.getElementById('counts');
  for (const [k, v] of Object.entries(s.counts)) {
    const tr = t.insertRow(); tr.insertCell().textContent = label[k] || k; tr.insertCell().textContent = v;
  }
}).catch(() => { document.getElementById('built').textContent = 'status.json を読めませんでした'; });
</script>
</body>
</html>
